# Pinned local tooling. Run `mise install` once in this folder.
# CI installs the same versions, so local results match the pipeline.
[tools]
terraform = "1.17.2"
tflint = "0.66.0"
uv = "0.13.9" # backend for Python-based tools below
"pipx:checkov" = "3.4.6" # installed as a Python package; the binary release has no Linux asset
hadolint = "2.15.1"
yamllint = "1.38.0"
gitleaks = "8.30.1"
terraform-docs = "0.25.1"
